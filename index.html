<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>22rubik_teacher</title>
    <meta
      name="description"
      content="2×2 Rubik beginner guide — David Guo method, step by step."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
:root {
  --ink: #0c2340;
  --ink-soft: #243b55;
  --mist: #e7eef5;
  --mist-2: #d5e4ec;
  --paper: #f7fafc;
  --accent: #e4572e;
  --accent-deep: #c2410c;
  --teal: #0f766e;
  --line: rgba(12, 35, 64, 0.12);
  --shadow: 0 28px 60px rgba(12, 35, 64, 0.12);
  --font-display: "Sora", "Noto Sans TC", sans-serif;
  --font-body: "Noto Sans TC", "Sora", sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--mist);
  overflow-x: hidden;
}

a {
  color: var(--teal);
}

.atmosphere {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(900px 520px at 12% -8%, rgba(228, 87, 46, 0.16), transparent 55%),
    radial-gradient(720px 480px at 92% 8%, rgba(15, 118, 110, 0.14), transparent 50%),
    linear-gradient(165deg, #f4f8fb 0%, #e4eef4 48%, #d8e6ef 100%);
}

.atmosphere::after {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.35;
  background-image: radial-gradient(rgba(12, 35, 64, 0.11) 0.8px, transparent 0.8px);
  background-size: 18px 18px;
  mask-image: linear-gradient(180deg, #000 20%, transparent 90%);
  pointer-events: none;
}

.app {
  width: min(1080px, calc(100% - 2.4rem));
  margin: 0 auto;
  padding: 1.4rem 0 2.5rem;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.mast {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 1rem;
  animation: fade-up 0.7s ease both;
}

.brand {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(1.35rem, 3.5vw, 1.75rem);
  letter-spacing: -0.03em;
  color: var(--ink);
  text-decoration: none;
  white-space: nowrap;
}

.brand span {
  color: var(--accent);
}

.rail {
  height: 4px;
  border-radius: 999px;
  background: rgba(12, 35, 64, 0.1);
  overflow: hidden;
}

.rail-fill {
  height: 100%;
  width: 0%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), var(--teal));
  transition: width 0.55s cubic-bezier(0.22, 1, 0.36, 1);
}

.mast-end {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.15rem;
  min-width: 3.25rem;
}

.app-version {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.72rem;
  letter-spacing: 0.04em;
  color: var(--ink-soft);
  opacity: 0.75;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.step-count {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.92rem;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}

.hero {
  flex: 1;
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: clamp(1.25rem, 4vw, 3rem);
  align-items: center;
  min-height: min(62vh, 560px);
}

@media (max-width: 720px) {
  .mast {
    grid-template-columns: 1fr auto;
  }

  .rail {
    grid-column: 1 / -1;
    order: 3;
  }

  .hero {
    grid-template-columns: 1fr;
    min-height: auto;
    gap: 1.5rem;
  }

  .viz {
    order: -1;
  }
}

.copy {
  max-width: 34rem;
}

.copy.enter {
  animation: step-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
}

.hold {
  margin: 0 0 0.65rem;
  font-family: var(--font-display);
  font-size: 0.84rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent-deep);
}

h1 {
  margin: 0 0 0.75rem;
  font-family: var(--font-display);
  font-weight: 750;
  font-size: clamp(1.85rem, 5vw, 3rem);
  line-height: 1.15;
  letter-spacing: -0.03em;
  color: var(--ink);
}

.body {
  margin: 0;
  font-size: 1.05rem;
  line-height: 1.65;
  color: var(--ink-soft);
}

.body strong {
  color: var(--ink);
  font-weight: 700;
}

.case-tip {
  display: block;
  margin-top: 0.65rem;
  color: var(--ink-soft);
}

.case-tip strong {
  color: var(--accent-deep);
  font-weight: 700;
}

/* Case-focus outlines on demo stickers (step 3 yellow-work). */
.sticker.is-focus {
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.2),
    0 0 0 3px rgba(228, 87, 46, 0.85);
  filter: brightness(1.08);
  z-index: 1;
}

.sticker.is-focus-avoid {
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.15),
    0 0 0 3px rgba(15, 118, 110, 0.8);
  filter: brightness(1.05);
  z-index: 1;
}

.cases {
  display: flex;
  flex-wrap: wrap;
  gap: 0.65rem 1.1rem;
  margin-top: 1.1rem;
}

.cases button {
  appearance: none;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  padding: 0.15rem 0;
  font: inherit;
  font-family: var(--font-display);
  font-weight: 600;
  color: var(--ink-soft);
  cursor: pointer;
  transition: color 0.2s ease, border-color 0.2s ease;
}

.cases button:hover {
  color: var(--ink);
}

.cases button.active {
  color: var(--accent-deep);
  border-color: var(--accent);
}

.practice-moves {
  margin-top: 1.25rem;
  padding-top: 1rem;
  border-top: 1px solid var(--line);
  animation: fade-up 0.45s ease both;
}

.practice-label {
  margin: 0 0 0.55rem;
  font-family: var(--font-display);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

.practice-btns {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
}

.practice-btns button {
  appearance: none;
  min-width: 2.4rem;
  padding: 0.35rem 0.55rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.55);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.98rem;
  letter-spacing: 0.02em;
  color: var(--ink);
  cursor: pointer;
  transition:
    color 0.2s ease,
    border-color 0.2s ease,
    background 0.2s ease,
    transform 0.2s ease;
}

.practice-btns button:hover:not(:disabled) {
  color: var(--accent-deep);
  border-color: rgba(228, 87, 46, 0.55);
  background: rgba(255, 255, 255, 0.85);
  transform: translateY(-1px);
}

.practice-btns button:disabled {
  opacity: 0.45;
  cursor: default;
}

.alg {
  margin-top: 1.1rem;
  padding-top: 1.1rem;
  border-top: 1px solid var(--line);
  animation: fade-up 0.45s ease both;
}

.practice-moves[hidden] + .alg {
  margin-top: 1.35rem;
}

.alg-name {
  margin: 0 0 0.7rem;
  font-size: 0.9rem;
  color: var(--ink-soft);
  cursor: pointer;
}

.moves {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
}

.move {
  min-width: 1.6rem;
  text-align: center;
  padding: 0.15rem 0.1rem;
  border-bottom: 2px solid transparent;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: 0.02em;
  color: var(--ink-soft);
  transition:
    transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
    color 0.25s ease,
    border-color 0.25s ease,
    opacity 0.25s ease;
}

.move.current {
  color: var(--accent-deep);
  border-color: var(--accent);
  transform: translateY(-2px) scale(1.12);
}

.move.done {
  opacity: 0.35;
}

.alg-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.9rem;
  margin-top: 0.85rem;
}

.text-btn {
  appearance: none;
  border: 0;
  background: none;
  padding: 0;
  font: inherit;
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--ink);
  cursor: pointer;
  border-bottom: 2px solid rgba(228, 87, 46, 0.45);
  transition: color 0.2s ease, border-color 0.2s ease;
}

.text-btn:hover:not(:disabled) {
  color: var(--accent-deep);
  border-color: var(--accent);
}

.text-btn.quiet {
  color: var(--ink-soft);
  border-color: transparent;
  font-weight: 600;
}

.text-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.viz {
  display: grid;
  place-items: center;
  min-height: 280px;
}

.cube-orbit {
  position: relative;
  width: min(280px, 70vw);
  height: min(280px, 70vw);
  display: grid;
  place-items: center;
  animation: float-y 5.5s ease-in-out infinite;
  perspective: 900px;
}

.cube-orbit.turning {
  animation: none;
}

.cube-orbit::before {
  content: "";
  position: absolute;
  inset: 12%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(228, 87, 46, 0.14), transparent 68%);
  transform: scale(0.85);
  opacity: 0;
  transition: opacity 0.4s ease, transform 0.4s ease;
}

.cube-orbit[data-hint="U"]::before,
.cube-orbit[data-hint="L"]::before,
.cube-orbit[data-hint="F"]::before,
.cube-orbit[data-hint="D"]::before {
  opacity: 1;
  transform: scale(1);
}

.cube {
  width: 168px;
  height: 168px;
  position: relative;
  transform-style: preserve-3d;
  transform: rotateX(-28deg) rotateY(38deg);
  transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
}

/* 2 黃：turn to show the yellow on the back of the top-left corner */
.cube-orbit.case-yaw-back .cube {
  transform: rotateX(-26deg) rotateY(-138deg);
}

.cubie {
  position: absolute;
  top: 42px;
  left: 42px;
  width: 84px;
  height: 84px;
  transform-style: preserve-3d;
  transform-origin: 50% 50% 0;
  will-change: transform;
}

.cubie.is-turning {
  z-index: 2;
}

.sticker {
  position: absolute;
  inset: 3px;
  border-radius: 6px;
  border: 1px solid rgba(0, 0, 0, 0.2);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
  backface-visibility: hidden;
}

.face-u {
  transform: rotateX(90deg) translateZ(42px);
}
.face-d {
  transform: rotateX(-90deg) translateZ(42px);
}
.face-f {
  transform: translateZ(42px);
}
.face-b {
  transform: rotateY(180deg) translateZ(42px);
}
.face-l {
  transform: rotateY(-90deg) translateZ(42px);
}
.face-r {
  transform: rotateY(90deg) translateZ(42px);
}

.cube-orbit[data-hint="U"] .face-u,
.cube-orbit[data-hint="D"] .face-d,
.cube-orbit[data-hint="F"] .face-f,
.cube-orbit[data-hint="L"] .face-l {
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.12),
    0 0 0 2px rgba(228, 87, 46, 0.7);
  filter: brightness(1.06);
}

.c-white {
  background: #f5f7fa;
}
.c-yellow {
  background: #f0c84a;
}
.c-red {
  background: #d64545;
}
.c-orange {
  background: #e8892c;
}
.c-blue {
  background: #2f6fdb;
}
.c-green {
  background: #2f9e66;
}

.nav {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  padding-top: 0.25rem;
  animation: fade-up 0.7s ease 0.1s both;
}

.nav-btn {
  appearance: none;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.55);
  color: var(--ink);
  border-radius: 12px;
  padding: 0.8rem 1.25rem;
  font: inherit;
  font-family: var(--font-display);
  font-weight: 700;
  cursor: pointer;
  transition:
    transform 0.2s ease,
    background 0.2s ease,
    border-color 0.2s ease,
    opacity 0.2s ease;
}

.nav-btn:hover:not(:disabled) {
  transform: translateY(-1px);
  border-color: rgba(12, 35, 64, 0.25);
}

.nav-btn.primary {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}

.nav-btn.primary:hover:not(:disabled) {
  background: var(--ink-soft);
}

.nav-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  transform: none;
}

.foot {
  margin-top: auto;
  font-size: 0.82rem;
  color: rgba(12, 35, 64, 0.55);
}

@keyframes fade-up {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes step-in {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes float-y {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-10px);
  }
}

@media (prefers-reduced-motion: reduce) {
  .cube-orbit,
  .copy.enter,
  .mast,
  .nav,
  .alg,
  .practice-moves,
  .rail-fill,
  .move,
  .cubie {
    animation: none !important;
    transition: none !important;
  }
}

    </style>
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="app">
      <header class="mast">
        <a class="brand" href="./">22rubik<span>_teacher</span></a>
        <div class="rail" aria-hidden="true">
          <div class="rail-fill" id="rail-fill"></div>
        </div>
        <div class="mast-end">
          <p class="app-version" id="app-version" hidden>v11</p>
          <p class="step-count" id="step-count">1 / 7</p>
        </div>
      </header>

      <section class="hero" aria-labelledby="step-title">
        <div class="copy" id="step-panel">
          <p class="hold" id="hold">拿著方塊…</p>
          <h1 id="step-title">載入中…</h1>
          <p class="body" id="step-body"></p>

          <div class="cases" id="cases" hidden></div>

          <div class="practice-moves" id="practice-moves" hidden>
            <p class="practice-label">試轉</p>
            <div class="practice-btns" id="practice-btns" role="group" aria-label="練習轉法">
              <button type="button" data-move="R">R</button>
              <button type="button" data-move="R'">R'</button>
              <button type="button" data-move="F">F</button>
              <button type="button" data-move="F'">F'</button>
              <button type="button" data-move="U">U</button>
              <button type="button" data-move="U'">U'</button>
              <!-- L/L' labels swapped vs tokens so UI direction matches animation -->
              <button type="button" data-move="L'">L</button>
              <button type="button" data-move="L">L'</button>
            </div>
          </div>

          <div class="alg" id="alg-block" hidden>
            <p class="alg-name" id="alg-label"></p>
            <div class="moves" id="moves" aria-live="polite"></div>
            <div class="alg-actions">
              <button type="button" class="text-btn" id="btn-play">播放</button>
              <button type="button" class="text-btn" id="btn-step">下一步手</button>
              <button type="button" class="text-btn quiet" id="btn-reset">重設</button>
            </div>
          </div>
        </div>

        <div class="viz">
          <div class="cube-orbit" id="cube-orbit" data-hint="">
            <div class="cube" id="cube" aria-hidden="true"></div>
          </div>
        </div>
      </section>

      <nav class="nav" aria-label="步驟">
        <button type="button" class="nav-btn" id="btn-prev">上一步</button>
        <button type="button" class="nav-btn primary" id="btn-next">下一步</button>
      </nav>

      <footer class="foot">
        解法依
        <a
          href="https://www.davidguo.idv.tw/Cube/22beginner.htm"
          target="_blank"
          rel="noopener noreferrer"
          >David Guo 二階簡易解法</a
        >
        · 圖示為本站重繪
      </footer>
    </main>

    <script>
(() => {
  /** Increment by 1 on every shipped update (shown on step 1, top-right). */
  const APP_VERSION = 11;

  /**
   * Sticker colour IDs → CSS classes. Face arrays store these keys
   * (e.g. "yellow"), not U/D/F/B/L/R face letters. To tweak a demo pose,
   * assign colour names on faces.U[i] etc. in setPreset (e.g. 1黃: leave
   * U[0] yellow, set U[1]/U[2]/U[3] to red/orange/green).
   */
  const COLORS = {
    white: "c-white",
    yellow: "c-yellow",
    green: "c-green",
    blue: "c-blue",
    orange: "c-orange",
    red: "c-red",
  };

  const FACE_ORDER = ["U", "R", "F", "D", "L", "B"];
  const CUBIE = 84;
  const HALF = CUBIE / 2;
  const TURN_MS = 420;
  const TURN_MS_180 = 560;
  const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /** @type {Record<string, string[]>} */
  let faces;

  const ALG1 = ["F", "R'", "F", "L2", "F'", "R", "F", "L2", "F2"];
  const ALG2 = ["R'", "U'", "R", "U'", "R'", "U2", "R"];

  /**
   * Step 3 (yellow-work) case copy + which stickers to outline.
   * Coords match CUBIES; face is the sticker face on that cubie.
   * David Guo: 1黃 left-top on U; 2黃 top-left yellow faces back; 0黃 top view as shown.
   */
  const YELLOW_CASES = {
    "1": {
      hold: "1 黃 · 上面左上角必須是黃",
      tip: `只有一格黃：把那格黃放到<strong>上面左上角</strong>（圖中高亮），再轉公式 2（通常兩次）。`,

    "2": {
      hold: "2 黃 · 左上角背後必須是黃",
      tip: `兩格黃：拿法要讓<strong>左上角那塊的黃色朝背後</strong>（圖中高亮背面），再轉公式 2，會變成「1 黃」。`,
      focus: [{ face: "B", x: -1, y: 1, z: -1 }],

    "0": {

      focus: [

        { face: "U", x: 1, y: 1, z: -1 },

      focusClass: "is-focus-avoid",

  const CUBIES = [
    { x: -1, y: 1, z: -1 },
    { x: 1, y: 1, z: -1 },
    { x: -1, y: 1, z: 1 },
    { x: 1, y: 1, z: 1 },
    { x: -1, y: -1, z: -1 },
    { x: 1, y: -1, z: -1 },
    { x: -1, y: -1, z: 1 },
    { x: 1, y: -1, z: 1 },
  ];

  const steps = [
    {
      id: "intro",
      title: "兩個公式，解完 2×2",
      body: `依循 David Guo「二階簡易解法」。一次只看一步——對齊畫面中的拿法，再動手。`,
      hold: "準備好實體方塊",
      hint: "",

      body: `<strong>R / R'</strong> 右面順／逆 · <strong>U / U'</strong> 上面 · <strong>F / F'</strong> 前面 · <strong>L</strong> 左面。加 <strong>2</strong> 表示轉半圈。原站編號：1=R' 2=U' 3=F' 4=R 5=U 6=F 7=L。`,
      hold: "白面朝上 · 綠面朝自己",
      hint: "U",
      showAlg: "both",
      cases: null,

    },
    {
      id: "step1",
      title: "第一步：一面轉好",
      body: `把<strong>白色面</strong>四個角拼齊。這步偏直覺。完成時，四個白貼紙都朝上。`,
      hold: "白面朝上",
      hint: "U",
      showAlg: null,
      cases: null,
      preset: "white-up",

      body: `看白層側面有無<strong>同色成對</strong>。放到<strong>左手邊</strong>，轉公式 1。若沒有成對，先轉一次公式 1。`,
      hold: "同色對 · 放左手邊",

    {

      body: `翻轉讓<strong>白面朝下</strong>。數上面黃貼紙數，選情況後轉公式 2（有時兩次，或先變成「1 黃」再處理）。`,
      hold: "白面朝下 · 選黃面情況",
      hint: "D",
      showAlg: "alg2",
      cases: ["1", "2", "0"],

    },
    {
      id: "step4",

      hold: "同色對 · 左手邊 · 再對齊上層",
      hint: "L",
      showAlg: "alg1",
      cases: null,
      preset: "almost",
    },
    {
      id: "done",
      title: "完成",
      body: `兩個公式就能解完。熟練後可接原站的 3×3 簡易解法——符號與流程相通。`,
      hold: "六面完成",
      hint: "",
      showAlg: null,
      cases: null,
      preset: "solved",
    },
  ];

  let stepIndex = 0;
  let caseId = "1";
  let playing = false;
  let animating = false;
  let playCursor = -1;
  let activeAlg = [];
  /** @type {HTMLElement[]} */
  let cubieNodes = [];

  const els = {
    railFill: document.getElementById("rail-fill"),
    stepCount: document.getElementById("step-count"),
    appVersion: document.getElementById("app-version"),
    stepPanel: document.getElementById("step-panel"),
    stepTitle: document.getElementById("step-title"),
    stepBody: document.getElementById("step-body"),
    hold: document.getElementById("hold"),
    cases: document.getElementById("cases"),
    algBlock: document.getElementById("alg-block"),
    algLabel: document.getElementById("alg-label"),
    moves: document.getElementById("moves"),
    practiceMoves: document.getElementById("practice-moves"),
    practiceBtns: document.getElementById("practice-btns"),
    btnPrev: document.getElementById("btn-prev"),
    btnNext: document.getElementById("btn-next"),
    btnPlay: document.getElementById("btn-play"),
    btnStep: document.getElementById("btn-step"),
    btnReset: document.getElementById("btn-reset"),
    cube: document.getElementById("cube"),
    cubeOrbit: document.getElementById("cube-orbit"),
  };

  function solvedFaces() {
    return {
      U: ["white", "white", "white", "white"],
      D: ["yellow", "yellow", "yellow", "yellow"],
      F: ["green", "green", "green", "green"],
      B: ["blue", "blue", "blue", "blue"],
      L: ["orange", "orange", "orange", "orange"],
      R: ["red", "red", "red", "red"],
    };
  }

  /**
   * Rotate a facelet quad as viewed on that face.
   * F/B index layout matches this CW sense; U/D/L/R use the inverse
   * (see faceletColor indexing vs outward view).
   */
  function rotateFaceCW(face, times) {
    const t = ((times % 4) + 4) % 4;
    let f = face;
    for (let i = 0; i < t; i += 1) {
      f = [f[2], f[0], f[3], f[1]];
    }
    return f;
  }

  function rotateFaceCCW(face, times) {
    return rotateFaceCW(face, (4 - (((times % 4) + 4) % 4)) % 4);
  }

  /** @deprecated alias used by flipWhiteDown */
  function rotateFace(face, times) {
    return rotateFaceCW(face, times);
  }

  // Facelet movers matched to CSS layer end poses (translate3d x,-y,z).
  // U family: keep turnDegrees; invert facelets so U' snap matches the
  // rotateY(+90) end pose (was snapping to U).

  function moveU(times = 1) {
    faces.U = rotateFaceCW(faces.U, times);
    for (let n = 0; n < times; n += 1) {
      const tmp = [faces.F[0], faces.F[1]];
      faces.F[0] = faces.R[0];
      faces.F[1] = faces.R[1];
      faces.R[0] = faces.B[0];
      faces.R[1] = faces.B[1];
      faces.B[0] = faces.L[0];
      faces.B[1] = faces.L[1];
      faces.L[0] = tmp[0];
      faces.L[1] = tmp[1];
    }
  }

  function moveD(times = 1) {
    faces.D = rotateFaceCCW(faces.D, times);
    for (let n = 0; n < times; n += 1) {
      const tmp = [faces.F[2], faces.F[3]];
      faces.F[2] = faces.R[2];
      faces.F[3] = faces.R[3];
      faces.R[2] = faces.B[2];
      faces.R[3] = faces.B[3];
      faces.B[2] = faces.L[2];
      faces.B[3] = faces.L[3];
      faces.L[2] = tmp[0];
      faces.L[3] = tmp[1];
    }
  }

  function moveF(times = 1) {
    faces.F = rotateFaceCW(faces.F, times);
    for (let n = 0; n < times; n += 1) {
      const u2 = faces.U[2];
      const u3 = faces.U[3];
      faces.U[2] = faces.L[3];
      faces.U[3] = faces.L[1];
      faces.L[1] = faces.D[0];
      faces.L[3] = faces.D[1];
      faces.D[0] = faces.R[2];
      faces.D[1] = faces.R[0];
      faces.R[0] = u2;
      faces.R[2] = u3;
    }
  }

  function moveB(times = 1) {
    faces.B = rotateFaceCW(faces.B, times);
    for (let n = 0; n < times; n += 1) {
      const u0 = faces.U[0];
      const u1 = faces.U[1];
      faces.U[0] = faces.R[1];
      faces.U[1] = faces.R[3];
      faces.R[1] = faces.D[3];
      faces.R[3] = faces.D[2];
      faces.D[2] = faces.L[0];
      faces.D[3] = faces.L[2];
      faces.L[0] = u1;
      faces.L[2] = u0;
    }
  }

  function moveL(times = 1) {
    faces.L = rotateFaceCCW(faces.L, times);
    for (let n = 0; n < times; n += 1) {
      const u0 = faces.U[0];
      const u2 = faces.U[2];
      const f0 = faces.F[0];
      const f2 = faces.F[2];
      const d0 = faces.D[0];
      const d2 = faces.D[2];
      const b1 = faces.B[1];
      const b3 = faces.B[3];
      // Left-layer sides only: DFL/DBL (D0/D2), not DFR/DBR.
      faces.U[0] = f0;
      faces.U[2] = f2;
      faces.F[0] = d0;
      faces.F[2] = d2;
      faces.D[0] = b3;
      faces.D[2] = b1;
      faces.B[1] = u2;
      faces.B[3] = u0;
    }
  }

  function moveR(times = 1) {
    // Inverted vs prior WCA-CW sense per user: token R' must spin the other way;
    // R / R' / R2 stay mutual inverses with matching CSS degrees.
    faces.R = rotateFaceCW(faces.R, times);
    for (let n = 0; n < times; n += 1) {
      const u1 = faces.U[1];
      const u3 = faces.U[3];
      const f1 = faces.F[1];
      const f3 = faces.F[3];
      const d1 = faces.D[1];
      const d3 = faces.D[3];
      const b0 = faces.B[0];
      const b2 = faces.B[2];
      faces.U[1] = f1;
      faces.U[3] = f3;
      faces.F[1] = d1;
      faces.F[3] = d3;
      faces.D[1] = b2;
      faces.D[3] = b0;
      faces.B[0] = u3;
      faces.B[2] = u1;
    }
  }

  const movers = { U: moveU, D: moveD, F: moveF, B: moveB, L: moveL, R: moveR };

  function parseToken(token) {
    const face = token[0];
    const suffix = token.slice(1);
    let quarterTurns = 1;
    if (suffix === "2") quarterTurns = 2;
    if (suffix === "'") quarterTurns = 3;
    return { face, quarterTurns, suffix };
  }

  function applyMove(token) {
    const { face, quarterTurns } = parseToken(token);
    movers[face](quarterTurns);
  }

  function flipWhiteDown() {
    const tmp = faces.U;
    faces.U = faces.D;
    faces.D = tmp;
    faces.F = rotateFace(faces.F, 2);
    faces.B = rotateFace(faces.B, 2);
    const left = faces.L;
    faces.L = rotateFace(faces.R, 2);
    faces.R = rotateFace(left, 2);
  }

  function faceletColor(face, x, y, z) {
    if (face === "U" && y === 1) {
      return faces.U[(z === 1 ? 2 : 0) + (x === 1 ? 1 : 0)];
    }
    if (face === "D" && y === -1) {
      return faces.D[(z === -1 ? 2 : 0) + (x === 1 ? 1 : 0)];
    }
    if (face === "F" && z === 1) {
      return faces.F[(y === -1 ? 2 : 0) + (x === 1 ? 1 : 0)];
    }
    if (face === "B" && z === -1) {
      return faces.B[(y === -1 ? 2 : 0) + (x === -1 ? 1 : 0)];
    }
    if (face === "L" && x === -1) {
      return faces.L[(y === -1 ? 2 : 0) + (z === 1 ? 1 : 0)];
    }
    if (face === "R" && x === 1) {
      return faces.R[(y === -1 ? 2 : 0) + (z === -1 ? 1 : 0)];
    }
    return null;
  }

  function cubieTranslate(x, y, z) {
    return `translate3d(${x * HALF}px, ${-y * HALF}px, ${z * HALF}px)`;
  }

  function paintCubie(node, x, y, z) {
    FACE_ORDER.forEach((face) => {
      const sticker = node.querySelector(`[data-face="${face}"]`);
      if (!sticker) return;
      const color = faceletColor(face, x, y, z);
      if (!color) {
        sticker.hidden = true;
        return;
      }
      sticker.hidden = false;
      sticker.className = `sticker face-${face.toLowerCase()} ${COLORS[color]}`;
      sticker.classList.remove("is-focus", "is-focus-avoid");
    });
  }

  function clearStickerFocus() {
    cubieNodes.forEach((node) => {
      node.querySelectorAll(".sticker").forEach((s) => {
        s.classList.remove("is-focus", "is-focus-avoid");
      });
    });
  }

  /** Outline the U/B stickers that the active yellow-work case cares about. */
  function applyYellowCaseHighlights() {
    clearStickerFocus();
    els.cubeOrbit.classList.remove("case-yaw-back");
    const step = steps[stepIndex];
    if (!step || step.preset !== "yellow-work") return;
    const cfg = YELLOW_CASES[caseId];
    if (!cfg) return;
    // 2 黃：yaw so the back sticker behind top-left is visible
    if (caseId === "2") els.cubeOrbit.classList.add("case-yaw-back");
    cfg.focus.forEach(({ face, x, y, z }) => {
      const i = CUBIES.findIndex((c) => c.x === x && c.y === y && c.z === z);
      if (i < 0) return;
      const sticker = cubieNodes[i]?.querySelector(`[data-face="${face}"]`);
      if (sticker && !sticker.hidden) sticker.classList.add(cfg.focusClass);
    });
  }

  function applyYellowCaseCopy() {
    const step = steps[stepIndex];
    if (!step) return;
    if (step.preset !== "yellow-work") {
      els.hold.textContent = step.hold;
      els.stepBody.innerHTML = step.body;
      return;
    }
    const cfg = YELLOW_CASES[caseId] || YELLOW_CASES["1"];
    els.hold.textContent = cfg.hold;
    els.stepBody.innerHTML = `${step.body}<span class="case-tip"> ${cfg.tip}</span>`;
  }

  function resetCubieTransforms() {
    cubieNodes.forEach((node, i) => {
      const { x, y, z } = CUBIES[i];
      node.style.transition = "none";
      node.style.transform = cubieTranslate(x, y, z);
    });
    void els.cube.offsetWidth;
  }

  function renderCube() {
    cubieNodes.forEach((node, i) => {
      const { x, y, z } = CUBIES[i];
      paintCubie(node, x, y, z);
      node.style.transform = cubieTranslate(x, y, z);
    });
    applyYellowCaseHighlights();
  }

  function layerPredicate(face) {
    if (face === "R") return (c) => c.x === 1;
    if (face === "L") return (c) => c.x === -1;
    if (face === "U") return (c) => c.y === 1;
    if (face === "D") return (c) => c.y === -1;
    if (face === "F") return (c) => c.z === 1;
    if (face === "B") return (c) => c.z === -1;
    return () => false;
  }

  /**
   * CSS degrees for one CW token (matched to applyMove / facelets).
   * Cubies use translate3d(x, -y, z): every CSS rotate*(θ) ≡ model rotate*(-θ).
   * R family uses the inverted sense vs classic WCA-CW so token R' matches
   * the user-facing direction fix; R / R' / R2 stay opposites with continuity.
   */
  function turnDegrees(face, quarterTurns) {
    const cw = {
      U: -90,
      D: 90,
      R: 90,
      L: 90,
      F: 90,
      B: -90,
    }[face];
    if (quarterTurns === 2) return cw * 2;
    if (quarterTurns === 3) return -cw;
    return cw;
  }

  function axisRotate(face, deg) {
    if (face === "U" || face === "D") return `rotateY(${deg}deg)`;
    if (face === "R" || face === "L") return `rotateX(${deg}deg)`;
    return `rotateZ(${deg}deg)`;
  }

  function wait(ms) {
    return new Promise((resolve) => {
      setTimeout(resolve, ms);
    });
  }

  function nextFrame() {
    return new Promise((resolve) => {
      requestAnimationFrame(() => requestAnimationFrame(resolve));
    });
  }

  /** One 90° layer spin (CW or prime), then commit matching facelets. */
  async function animateQuarter(face, prime) {
    const token = prime ? `${face}'` : face;
    const deg = turnDegrees(face, prime ? 3 : 1);
    const ms = TURN_MS;
    const pred = layerPredicate(face);
    const moversIdx = [];

    renderCube();
    cubieNodes.forEach((node, i) => {
      const c = CUBIES[i];
      node.classList.remove("is-turning");
      node.style.transition = "none";
      node.style.transform = cubieTranslate(c.x, c.y, c.z);
      if (pred(c)) moversIdx.push(i);
    });
    await nextFrame();

    els.cubeOrbit.classList.add("turning");
    moversIdx.forEach((i) => {
      const c = CUBIES[i];
      const node = cubieNodes[i];
      node.classList.add("is-turning");
      node.style.transition = `transform ${ms}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
      node.style.transform = `${axisRotate(face, deg)} ${cubieTranslate(c.x, c.y, c.z)}`;
    });

    await wait(ms + 30);
    applyMove(token);
    els.cubeOrbit.classList.remove("turning");
    cubieNodes.forEach((node) => node.classList.remove("is-turning"));
    resetCubieTransforms();
    renderCube();
  }

  async function animateToken(token) {
    const { face, quarterTurns } = parseToken(token);

    if (reducedMotion) {
      applyMove(token);
      renderCube();
      return;
    }

    // Doubles: two successive CW quarters (X then X), not one ±180 tween.
    if (quarterTurns === 2) {
      await animateQuarter(face, false);
      await wait(60);
      await animateQuarter(face, false);
      return;
    }

    await animateQuarter(face, quarterTurns === 3);
  }

  function stopPlay() {
    playing = false;
    els.btnPlay.textContent = "播放";
  }

  function setPreset(name) {
    faces = solvedFaces();
    if (name === "yellow-work") {
      flipWhiteDown();
      if (caseId === "1") {
        // 1 黃：U top-left (UBL / U[0]) stays yellow; other three U stickers non-yellow
        faces.U[1] = "red";
        faces.R[0] = "white";
        faces.U[2] = "orange";
        faces.L[1] = "white";
        faces.U[3] = "green";
        faces.F[1] = "white";
      } else if (caseId === "2") {
        // 2 黃 (David Guo)：左上角黃色朝背後 — UBL's B sticker yellow; two yellows remain on U
        faces.U[0] = "blue";
        faces.B[1] = "yellow";
        faces.U[3] = "green";
        faces.F[1] = "white";
      } else if (caseId === "0") {
        // 0 黃：no yellow on U; back row U[0]+U[1] must not be yellow (all four clear)
        faces.U[0] = "blue";
        faces.B[1] = "white";
        faces.U[1] = "red";
        faces.R[0] = "white";
        faces.U[2] = "orange";
        faces.L[1] = "white";
        faces.U[3] = "green";
        faces.F[1] = "white";
      }
    } else if (name === "almost") {
      flipWhiteDown();
      moveU(1);
    }
    resetCubieTransforms();
    renderCube();
  }

  function renderMoves(tokens) {
    els.moves.innerHTML = "";
    tokens.forEach((token, i) => {
      const span = document.createElement("span");
      span.className = "move";
      span.textContent = token;
      span.dataset.index = String(i);
      els.moves.appendChild(span);
    });
  }

  function paintMoveHighlight() {
    [...els.moves.children].forEach((node, i) => {
      node.classList.toggle("current", i === playCursor);
      node.classList.toggle("done", playCursor > i);
    });
  }

  function renderPracticeMoves() {
    const step = steps[stepIndex];
    const show = step.id === "notation";
    if (!els.practiceMoves) return;
    els.practiceMoves.hidden = !show;
    setPracticeBusy(animating || playing);
  }

  function setPracticeBusy(busy) {
    if (!els.practiceBtns) return;
    [...els.practiceBtns.querySelectorAll("button")].forEach((btn) => {
      btn.disabled = busy;
    });
  }

  async function practiceMove(token) {
    if (animating || playing) return;
    const step = steps[stepIndex];
    if (!step || step.id !== "notation") return;
    animating = true;
    setControlsBusy(true);
    setPracticeBusy(true);
    try {
      await animateToken(token);
    } finally {
      animating = false;
      setControlsBusy(false);
      setPracticeBusy(false);
    }
  }

  function loadAlgForStep() {
    const step = steps[stepIndex];
    stopPlay();
    playCursor = -1;
    renderPracticeMoves();

    if (!step.showAlg) {
      els.algBlock.hidden = true;
      activeAlg = [];
      els.btnPlay.disabled = true;
      els.btnStep.disabled = true;
      return;
    }

    els.algBlock.hidden = false;
    if (step.showAlg === "alg1") {
      activeAlg = [...ALG1];
      els.algLabel.textContent = "公式 1 · F R' F L2 F' R F L2 F2";
    } else if (step.showAlg === "alg2") {
      activeAlg = [...ALG2];
      els.algLabel.textContent = "公式 2 · R' U' R U' R' U2 R";
    } else {
      activeAlg = [...ALG1];
      els.algLabel.textContent = "公式 1（點此切換公式 2）";
    }
    renderMoves(activeAlg);
    paintMoveHighlight();
    els.btnPlay.disabled = false;
    els.btnStep.disabled = false;
  }

  function renderCases() {
    const step = steps[stepIndex];
    els.cases.innerHTML = "";
    if (!step.cases) {
      els.cases.hidden = true;
      return;
    }
    els.cases.hidden = false;
    const labels = { "1": "1 黃", "2": "2 黃", "0": "0 黃" };
    step.cases.forEach((id) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = labels[id];
      btn.classList.toggle("active", caseId === id);
      btn.addEventListener("click", () => {
        caseId = id;
        renderCases();
        applyYellowCaseCopy();
        setPreset(step.preset);
        loadAlgForStep();
      });
      els.cases.appendChild(btn);
    });
  }

  function animateStepPanel() {
    els.stepPanel.classList.remove("enter");
    void els.stepPanel.offsetWidth;
    els.stepPanel.classList.add("enter");
  }

  function renderProgress() {
    const pct = ((stepIndex + 1) / steps.length) * 100;
    els.railFill.style.width = `${pct}%`;
    els.stepCount.textContent = `${stepIndex + 1} / ${steps.length}`;
    if (els.appVersion) {
      els.appVersion.textContent = `v${APP_VERSION}`;
      els.appVersion.hidden = stepIndex !== 0;
    }
  }

  function setControlsBusy(busy) {
    els.btnStep.disabled = busy || !activeAlg.length;
    els.btnPlay.disabled = busy || !activeAlg.length;
    els.btnReset.disabled = busy;
    els.btnPrev.disabled = busy || stepIndex === 0;
    els.btnNext.disabled = busy || stepIndex === steps.length - 1;
    setPracticeBusy(busy);
  }

  function renderStep() {
    const step = steps[stepIndex];
    els.stepTitle.textContent = step.title;
    els.cubeOrbit.dataset.hint = step.hint || "";
    els.btnNext.textContent =
      stepIndex === steps.length - 1 ? "完成" : "下一步";
    renderProgress();
    renderCases();
    applyYellowCaseCopy();
    setPreset(step.preset);
    loadAlgForStep();
    setControlsBusy(false);
    animateStepPanel();
  }

  function goTo(index) {
    if (animating) return;
    stopPlay();
    stepIndex = Math.max(0, Math.min(steps.length - 1, index));
    renderStep();
  }

  async function stepOnce() {
    if (animating || !activeAlg.length) return;
    if (playCursor >= activeAlg.length - 1) {
      playCursor = -1;
      setPreset(steps[stepIndex].preset);
      paintMoveHighlight();
      return;
    }
    if (playCursor === -1) {
      setPreset(steps[stepIndex].preset);
    }
    playCursor += 1;
    paintMoveHighlight();
    animating = true;
    setControlsBusy(true);
    els.btnPlay.disabled = false;
    try {
      await animateToken(activeAlg[playCursor]);
    } finally {
      animating = false;
      if (!playing) setControlsBusy(false);
    }
  }

  async function playAlg() {
    if (!activeAlg.length || animating) return;
    if (playing) {
      stopPlay();
      setControlsBusy(false);
      return;
    }
    if (playCursor >= activeAlg.length - 1 || playCursor === -1) {
      playCursor = -1;
      setPreset(steps[stepIndex].preset);
      paintMoveHighlight();
    }
    playing = true;
    els.btnPlay.textContent = "暫停";
    setControlsBusy(true);
    els.btnPlay.disabled = false;

    while (playing && playCursor < activeAlg.length - 1) {
      await stepOnce();
      if (!playing) break;
      await wait(90);
    }
    stopPlay();
    setControlsBusy(false);
  }

  function buildCubeDom() {
    els.cube.innerHTML = "";
    cubieNodes = CUBIES.map(({ x, y, z }, index) => {
      const cubie = document.createElement("div");
      cubie.className = "cubie";
      cubie.dataset.index = String(index);
      cubie.style.transform = cubieTranslate(x, y, z);
      FACE_ORDER.forEach((face) => {
        const sticker = document.createElement("div");
        sticker.className = `sticker face-${face.toLowerCase()}`;
        sticker.dataset.face = face;
        cubie.appendChild(sticker);
      });
      els.cube.appendChild(cubie);
      return cubie;
    });
  }

  els.btnPrev.addEventListener("click", () => goTo(stepIndex - 1));
  els.btnNext.addEventListener("click", () => goTo(stepIndex + 1));
  els.btnPlay.addEventListener("click", () => {
    playAlg();
  });
  els.btnStep.addEventListener("click", () => {
    stopPlay();
    stepOnce();
  });
  els.btnReset.addEventListener("click", () => {
    if (animating) return;
    stopPlay();
    playCursor = -1;
    setPreset(steps[stepIndex].preset);
    paintMoveHighlight();
    setControlsBusy(false);
  });
  if (els.practiceBtns) {
    els.practiceBtns.addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-move]");
      if (!btn || btn.disabled) return;
      practiceMove(btn.dataset.move);
    });
  }

  els.algLabel.addEventListener("click", () => {
    const step = steps[stepIndex];
    if (step.showAlg !== "both" || animating) return;
    if (activeAlg[0] === "F") {
      activeAlg = [...ALG2];
      els.algLabel.textContent = "公式 2（點此切換公式 1）";
    } else {
      activeAlg = [...ALG1];
      els.algLabel.textContent = "公式 1（點此切換公式 2）";
    }
    stopPlay();
    playCursor = -1;
    renderMoves(activeAlg);
    paintMoveHighlight();
  });

  buildCubeDom();
  faces = solvedFaces();
  renderStep();
})();

    </script>
  </body>
</html>
