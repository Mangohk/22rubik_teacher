<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>22rubik_teacher</title>
    <meta
      name="description"
      content="2×2 Rubik beginner guide — David Guo method, step by step."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
:root {
  --ink: #0c2340;
  --ink-soft: #243b55;
  --mist: #e7eef5;
  --mist-2: #d5e4ec;
  --paper: #f7fafc;
  --accent: #e4572e;
  --accent-deep: #c2410c;
  --teal: #0f766e;
  --line: rgba(12, 35, 64, 0.12);
  --shadow: 0 28px 60px rgba(12, 35, 64, 0.12);
  --font-display: "Sora", "Noto Sans TC", sans-serif;
  --font-body: "Noto Sans TC", "Sora", sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  min-height: 100%;
}

body {
  font-family: var(--font-body);
  color: var(--ink);
  background: var(--mist);
  overflow-x: hidden;
}

a {
  color: var(--teal);
}

.atmosphere {
  position: fixed;
  inset: 0;
  z-index: -1;
  background:
    radial-gradient(900px 520px at 12% -8%, rgba(228, 87, 46, 0.16), transparent 55%),
    radial-gradient(720px 480px at 92% 8%, rgba(15, 118, 110, 0.14), transparent 50%),
    linear-gradient(165deg, #f4f8fb 0%, #e4eef4 48%, #d8e6ef 100%);
}

.atmosphere::after {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.35;
  background-image: radial-gradient(rgba(12, 35, 64, 0.11) 0.8px, transparent 0.8px);
  background-size: 18px 18px;
  mask-image: linear-gradient(180deg, #000 20%, transparent 90%);
  pointer-events: none;
}

.app {
  width: min(1080px, calc(100% - 2.4rem));
  margin: 0 auto;
  padding: 1.4rem 0 2.5rem;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}

.mast {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 1rem;
  animation: fade-up 0.7s ease both;
}

.brand {
  font-family: var(--font-display);
  font-weight: 800;
  font-size: clamp(1.35rem, 3.5vw, 1.75rem);
  letter-spacing: -0.03em;
  color: var(--ink);
  text-decoration: none;
  white-space: nowrap;
}

.brand span {
  color: var(--accent);
}

.rail {
  height: 4px;
  border-radius: 999px;
  background: rgba(12, 35, 64, 0.1);
  overflow: hidden;
}

.rail-fill {
  height: 100%;
  width: 0%;
  border-radius: inherit;
  background: linear-gradient(90deg, var(--accent), var(--teal));
  transition: width 0.55s cubic-bezier(0.22, 1, 0.36, 1);
}

.mast-end {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.15rem;
  min-width: 3.25rem;
}

.app-version {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.72rem;
  letter-spacing: 0.04em;
  color: var(--ink-soft);
  opacity: 0.75;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}

.step-count {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 0.92rem;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}

.hero {
  flex: 1;
  display: grid;
  grid-template-columns: 1.05fr 0.95fr;
  gap: clamp(1.25rem, 4vw, 3rem);
  align-items: center;
  min-height: min(62vh, 560px);
}

@media (max-width: 720px) {
  .mast {
    grid-template-columns: 1fr auto;
  }

  .rail {
    grid-column: 1 / -1;
    order: 3;
  }

  .hero {
    grid-template-columns: 1fr;
    min-height: auto;
    gap: 1.5rem;
  }

  .viz {
    order: -1;
  }
}

.copy {
  max-width: 34rem;
}

.copy.enter {
  animation: step-in 0.55s cubic-bezier(0.22, 1, 0.36, 1) both;
}

.hold {
  margin: 0 0 0.65rem;
  font-family: var(--font-display);
  font-size: 0.84rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--accent-deep);
}

h1 {
  margin: 0 0 0.75rem;
  font-family: var(--font-display);
  font-weight: 750;
  font-size: clamp(1.85rem, 5vw, 3rem);
  line-height: 1.15;
  letter-spacing: -0.03em;
  color: var(--ink);
}

.body {
  margin: 0;
  font-size: 1.05rem;
  line-height: 1.65;
  color: var(--ink-soft);
}

.body strong {
  color: var(--ink);
  font-weight: 700;
}

.case-tip {
  display: block;
  margin-top: 0.65rem;
  color: var(--ink-soft);
}

.case-tip strong {
  color: var(--accent-deep);
  font-weight: 700;
}

/* Sticker / face focus outlines — border stays visible under 3D transforms.
   Avoid CSS filter here: WebKit flattens preserve-3d when a child uses filter. */
.sticker.is-focus {
  border: 4px solid #e4572e;
  box-shadow:
    inset 0 0 0 2px rgba(255, 255, 255, 0.9),
    0 0 0 3px rgba(228, 87, 46, 0.55),
    0 0 16px rgba(228, 87, 46, 0.7);
  z-index: 3;
}

.sticker.is-focus-avoid {
  border: 4px solid #0f766e;
  box-shadow:
    inset 0 0 0 2px rgba(255, 255, 255, 0.85),
    0 0 0 3px rgba(15, 118, 110, 0.5),
    0 0 16px rgba(15, 118, 110, 0.65);
  z-index: 3;
}

.teach-dock {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 0.85rem;
  width: min(100%, 28rem);
  margin-left: auto;
  animation: fade-up 0.55s ease both;
}

.teach-dock:not(:has(.dock-block:not([hidden]), .alg:not([hidden]))) {
  display: none;
}

.dock-block {
  width: 100%;
}

.dock-block[hidden] {
  display: none !important;
}

.dock-label {
  margin: 0 0 0.45rem;
  font-family: var(--font-display);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
  text-align: right;
}

.cases {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 0.65rem 1.1rem;
  margin-top: 0;
  width: 100%;
}

.cases button {
  appearance: none;
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  padding: 0.15rem 0;
  font: inherit;
  font-family: var(--font-display);
  font-weight: 600;
  color: var(--ink-soft);
  cursor: pointer;
  transition: color 0.2s ease, border-color 0.2s ease;
}

.cases button:hover {
  color: var(--ink);
}

.cases button.active {
  color: var(--accent-deep);
  border-color: var(--accent);
}

.practice-moves {
  margin-top: 1.25rem;
  padding-top: 1rem;
  border-top: 1px solid var(--line);
  animation: fade-up 0.45s ease both;
}

.practice-label {
  margin: 0 0 0.55rem;
  font-family: var(--font-display);
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--ink-soft);
}

.practice-btns {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
}

.practice-btns button {
  appearance: none;
  min-width: 2.4rem;
  padding: 0.35rem 0.55rem;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.55);
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 0.98rem;
  letter-spacing: 0.02em;
  color: var(--ink);
  cursor: pointer;
  transition:
    color 0.2s ease,
    border-color 0.2s ease,
    background 0.2s ease,
    transform 0.2s ease;
}

.practice-btns button:hover:not(:disabled) {
  color: var(--accent-deep);
  border-color: rgba(228, 87, 46, 0.55);
  background: rgba(255, 255, 255, 0.85);
  transform: translateY(-1px);
}

.practice-btns button:disabled {
  opacity: 0.45;
  cursor: default;
}

.alg {
  margin-top: 0;
  padding: 0.85rem 1rem 1rem;
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255, 255, 255, 0.55);
  animation: fade-up 0.45s ease both;
}

.alg[hidden] {
  display: none !important;
}

.alg-name {
  margin: 0 0 0.7rem;
  font-size: 0.9rem;
  color: var(--ink-soft);
  text-align: right;
}

.alg-seq + .alg-seq {
  margin-top: 1rem;
}

.alg-seq.is-playable .alg-name {
  cursor: pointer;
}

.alg-seq.is-active .alg-name {
  color: var(--ink);
  font-weight: 700;
}

.moves {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 0.4rem;
}

.move {
  min-width: 1.6rem;
  text-align: center;
  padding: 0.15rem 0.1rem;
  border-bottom: 2px solid transparent;
  font-family: var(--font-display);
  font-weight: 700;
  font-size: 1.05rem;
  letter-spacing: 0.02em;
  color: var(--ink-soft);
  transition:
    transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
    color 0.25s ease,
    border-color 0.25s ease,
    opacity 0.25s ease;
}

.move.current {
  color: var(--accent-deep);
  border-color: var(--accent);
  transform: translateY(-2px) scale(1.12);
}

.move.done {
  opacity: 0.35;
}

.alg-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  align-items: center;
  gap: 0.75rem 0.9rem;
  margin-top: 0.85rem;
}

.alg-actions[hidden] {
  display: none !important;
}

.alg-seq .alg-actions {
  margin-top: 0.65rem;
}

.text-btn {
  appearance: none;
  border: 0;
  background: none;
  padding: 0;
  font: inherit;
  font-family: var(--font-display);
  font-weight: 700;
  color: var(--ink);
  cursor: pointer;
  border-bottom: 2px solid rgba(228, 87, 46, 0.45);
  transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease,
    transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
}

.text-btn:hover:not(:disabled) {
  color: var(--accent-deep);
  border-color: var(--accent);
}

.text-btn.quiet {
  color: var(--ink-soft);
  border-color: transparent;
  font-weight: 600;
}

.text-btn.turn {
  border: 0;
  border-bottom: 0;
  border-radius: 10px;
  background: var(--teal);
  color: #f4fbfa;
  padding: 0.55rem 1.15rem;
  font-weight: 800;
  letter-spacing: 0.02em;
  box-shadow: 0 8px 18px rgba(15, 118, 110, 0.28);
}

.text-btn.turn:hover:not(:disabled) {
  color: #fff;
  background: #0d9488;
  border-color: transparent;
  transform: translateY(-1px);
  box-shadow: 0 10px 22px rgba(15, 118, 110, 0.34);
}

.text-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.text-btn.turn:disabled {
  box-shadow: none;
  transform: none;
}

@media (max-width: 720px) {
  .teach-dock {
    width: 100%;
    align-items: stretch;
  }

  .dock-label,
  .alg-name {
    text-align: left;
  }

  .cases,
  .moves,
  .alg-actions {
    justify-content: flex-start;
  }

  .text-btn.turn {
    min-height: 2.75rem;
    padding: 0.65rem 1.25rem;
    font-size: 1.05rem;
  }
}

.viz {
  display: grid;
  place-items: center;
  min-height: 280px;
}

.cube-orbit {
  position: relative;
  width: min(280px, 70vw);
  height: min(280px, 70vw);
  display: grid;
  place-items: center;
  animation: float-y 5.5s ease-in-out infinite;
  perspective: 900px;
  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
  cursor: grab;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
}

.cube-orbit.turning,
.cube-orbit.is-dragging {
  animation: none;
}

.cube-orbit.is-dragging {
  cursor: grabbing;
}

.cube-orbit::before {
  content: "";
  position: absolute;
  inset: 12%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(228, 87, 46, 0.14), transparent 68%);
  transform: scale(0.85);
  opacity: 0;
  transition: opacity 0.4s ease, transform 0.4s ease;
}

.cube-orbit[data-hint="U"]::before,
.cube-orbit[data-hint="L"]::before,
.cube-orbit[data-hint="F"]::before,
.cube-orbit[data-hint="D"]::before {
  opacity: 1;
  transform: scale(1);
}

.cube-rig {
  width: 168px;
  height: 168px;
  position: relative;
  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
  /* Viewpoint set in JS (drag orbit + step/case defaults). */
  transform: rotateX(-28deg) rotateY(38deg);
  transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1);
  pointer-events: none;
}

.cube {
  width: 168px;
  height: 168px;
  position: relative;
  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
}

/* 3D marker outside the green (F) face; rides with cube-rig viewpoint. */
.face-arrow {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 112px;
  height: 260px;
  margin: -130px 0 0 -56px;
  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
  /* Outside F (+Z); tip points away from the face. */
  transform: translateZ(280px) rotateX(90deg);
  color: #ffffff;
  z-index: 6;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  /* Avoid filter/opacity here — WebKit flattens preserve-3d ancestors. */
}

.face-arrow .facing-label {
  margin: 0;
  font-family: var(--font-display);
  font-size: 1.35rem;
  font-weight: 800;
  letter-spacing: 0.04em;
  line-height: 1;
  color: #ffffff;
  text-shadow:
    0 0 2px rgba(12, 35, 64, 0.9),
    0 1px 4px rgba(12, 35, 64, 0.55),
    0 0 10px rgba(12, 35, 64, 0.35);
  white-space: nowrap;
}

.face-arrow svg {
  display: block;
  width: 112px;
  height: 220px;
  overflow: visible;
}

.cubie {
  position: absolute;
  top: 42px;
  left: 42px;
  width: 84px;
  height: 84px;
  transform-style: preserve-3d;
  -webkit-transform-style: preserve-3d;
  transform-origin: 50% 50% 0;
  will-change: transform;
}

.cubie.is-turning {
  z-index: 2;
}

.sticker {
  position: absolute;
  inset: 3px;
  border-radius: 6px;
  border: 1px solid rgba(0, 0, 0, 0.2);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.12);
  backface-visibility: hidden;
}

.face-u {
  transform: rotateX(90deg) translateZ(42px);
}
.face-d {
  transform: rotateX(-90deg) translateZ(42px);
}
.face-f {
  transform: translateZ(42px);
}
.face-b {
  transform: rotateY(180deg) translateZ(42px);
}
.face-l {
  transform: rotateY(-90deg) translateZ(42px);
}
.face-r {
  transform: rotateY(90deg) translateZ(42px);
}

.cube-orbit[data-hint="U"] .face-u,
.cube-orbit[data-hint="D"] .face-d,
.cube-orbit[data-hint="F"] .face-f,
.cube-orbit[data-hint="L"] .face-l {
  box-shadow:
    inset 0 0 0 3px rgba(255, 255, 255, 0.75),
    0 0 0 6px rgba(228, 87, 46, 1),
    0 0 16px rgba(228, 87, 46, 0.65);
}

.c-white {
  background: #f5f7fa;
}
.c-yellow {
  background: #f0c84a;
}
.c-red {
  background: #d64545;
}
.c-orange {
  background: #e8892c;
}
.c-blue {
  background: #2f6fdb;
}
.c-green {
  background: #2f9e66;
}

.nav {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  padding-top: 0.25rem;
  animation: fade-up 0.7s ease 0.1s both;
}

.nav-btn {
  appearance: none;
  border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.55);
  color: var(--ink);
  border-radius: 12px;
  padding: 0.8rem 1.25rem;
  font: inherit;
  font-family: var(--font-display);
  font-weight: 700;
  cursor: pointer;
  transition:
    transform 0.2s ease,
    background 0.2s ease,
    border-color 0.2s ease,
    opacity 0.2s ease;
}

.nav-btn:hover:not(:disabled) {
  transform: translateY(-1px);
  border-color: rgba(12, 35, 64, 0.25);
}

.nav-btn.primary {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}

.nav-btn.primary:hover:not(:disabled) {
  background: var(--ink-soft);
}

.nav-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
  transform: none;
}

.foot {
  margin-top: auto;
  font-size: 0.82rem;
  color: rgba(12, 35, 64, 0.55);
}

@keyframes fade-up {
  from {
    opacity: 0;
    transform: translateY(12px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes step-in {
  from {
    opacity: 0;
    transform: translateY(16px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

@keyframes float-y {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-10px);
  }
}

@media (prefers-reduced-motion: reduce) {
  .cube-orbit,
  .cube-rig,
  .copy.enter,
  .mast,
  .nav,
  .alg,
  .practice-moves,
  .teach-dock,
  .rail-fill,
  .move,
  .cubie {
    animation: none !important;
    transition: none !important;
  }
}

    </style>
  </head>
  <body>
    <div class="atmosphere" aria-hidden="true"></div>

    <main class="app">
      <header class="mast">
        <a class="brand" href="./">22rubik<span>_teacher</span></a>
        <div class="rail" aria-hidden="true">
          <div class="rail-fill" id="rail-fill"></div>
        </div>
        <div class="mast-end">
          <p class="app-version" id="app-version" hidden>v1.14</p>
          <p class="step-count" id="step-count">1 / 7</p>
        </div>
      </header>

      <section class="hero" aria-labelledby="step-title">
        <div class="copy" id="step-panel">

            <div class="practice-btns" id="practice-btns" role="group" aria-label="練習轉法">

              <button type="button" data-move="R'">R'</button>
              <button type="button" data-move="F">F</button>
              <button type="button" data-move="F'">F'</button>
              <button type="button" data-move="U">U</button>
              <button type="button" data-move="U'">U'</button>
              <button type="button" data-move="D">D</button>
              <button type="button" data-move="D'">D'</button>
              <button type="button" data-move="L">L</button>
              <button type="button" data-move="L'">L'</button>
            </div>
          </div>
        </div>

        <div class="viz">
          <div class="cube-orbit" id="cube-orbit" data-hint="">
            <div class="cube-rig" id="cube-rig">
              <div class="cube" id="cube" aria-hidden="true"></div>
              <div class="face-arrow" title="綠面朝自己" aria-hidden="true">
                <p class="facing-label">朝自己</p>
                <svg viewBox="0 0 112 220">
                  <path
                    d="M56 24 L56 156"
                    fill="none"
                    stroke="rgba(12, 35, 64, 0.35)"
                    stroke-width="28"
                    stroke-linecap="round"
                  />
                  <path
                    d="M56 24 L56 156"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="18"
                    stroke-linecap="round"
                  />
                  <path
                    d="M12 84 L56 20 L100 84"
                    fill="rgba(12, 35, 64, 0.35)"
                    stroke="rgba(12, 35, 64, 0.35)"
                    stroke-width="8"
                    stroke-linejoin="round"
                  />
                  <path
                    d="M20 80 L56 32 L92 80 Z"
                    fill="currentColor"
                    stroke="currentColor"
                    stroke-width="4"
                    stroke-linejoin="round"
                  />
                </svg>
              </div>
            </div>
          </div>
        </div>
      </section>

      <div class="teach-dock" id="teach-dock" aria-label="教學操作">

      title: "先認得轉法符號",
      body: `<strong>R / R'</strong> 右面順／逆 · <strong>U / U'</strong> 上面 · <strong>F / F'</strong> 前面 · <strong>L</strong> 左面。加 <strong>2</strong> 表示轉半圈。原站編號：1=R' 2=U' 3=F' 4=R 5=U 6=F 7=L。`,

  function solvedFaces() {
    return {
      U: ["white", "white", "white", "white"],
      D: ["yellow", "yellow", "yellow", "yellow"],
      F: ["green", "green", "green", "green"],
      B: ["blue", "blue", "blue", "blue"],
      L: ["orange", "orange", "orange", "orange"],
      R: ["red", "red", "red", "red"],

  }

  /**
   * Rotate a facelet quad as viewed on that face.
   * F/B index layout matches this CW sense; U/D/L/R use the inverse
   * (see faceletColor indexing vs outward view).
   */
  function rotateFaceCW(face, times) {
    const t = ((times % 4) + 4) % 4;
    let f = face;
    for (let i = 0; i < t; i += 1) {
      f = [f[2], f[0], f[3], f[1]];
    }
    return f;
  }

  function rotateFaceCCW(face, times) {
    return rotateFaceCW(face, (4 - (((times % 4) + 4) % 4)) % 4);
  }

  /** @deprecated alias used by flipWhiteDown */
  function rotateFace(face, times) {
    return rotateFaceCW(face, times);
  }

  // Facelet movers matched to CSS layer end poses (translate3d x,-y,z).
  // U family: keep turnDegrees; invert facelets so U' snap matches the
  // rotateY(+90) end pose (was snapping to U).

  function moveU(times = 1) {
    faces.U = rotateFaceCW(faces.U, times);
    for (let n = 0; n < times; n += 1) {
      const tmp = [faces.F[0], faces.F[1]];
      faces.F[0] = faces.R[0];
      faces.F[1] = faces.R[1];
      faces.R[0] = faces.B[0];
      faces.R[1] = faces.B[1];
      faces.B[0] = faces.L[0];
      faces.B[1] = faces.L[1];
      faces.L[0] = tmp[0];
      faces.L[1] = tmp[1];
    }
  }

  function moveD(times = 1) {
    // Facelets inverted vs prior sense so D / D' snap matches rotateY end pose
    // (was applying the opposite of the animated quarter).
    faces.D = rotateFaceCW(faces.D, times);
    for (let n = 0; n < times; n += 1) {
      const tmp = [faces.F[2], faces.F[3]];
      faces.F[2] = faces.L[2];
      faces.F[3] = faces.L[3];
      faces.L[2] = faces.B[2];
      faces.L[3] = faces.B[3];
      faces.B[2] = faces.R[2];
      faces.B[3] = faces.R[3];
      faces.R[2] = tmp[0];
      faces.R[3] = tmp[1];
    }
  }

  function moveF(times = 1) {
    faces.F = rotateFaceCW(faces.F, times);
    for (let n = 0; n < times; n += 1) {
      const u2 = faces.U[2];
      const u3 = faces.U[3];
      faces.U[2] = faces.L[3];
      faces.U[3] = faces.L[1];
      faces.L[1] = faces.D[0];
      faces.L[3] = faces.D[1];
      faces.D[0] = faces.R[2];
      faces.D[1] = faces.R[0];
      faces.R[0] = u2;
      faces.R[2] = u3;
    }
  }

  function moveB(times = 1) {
    faces.B = rotateFaceCW(faces.B, times);
    for (let n = 0; n < times; n += 1) {
      const u0 = faces.U[0];
      const u1 = faces.U[1];
      faces.U[0] = faces.R[1];
      faces.U[1] = faces.R[3];
      faces.R[1] = faces.D[3];
      faces.R[3] = faces.D[2];
      faces.D[2] = faces.L[0];
      faces.D[3] = faces.L[2];
      faces.L[0] = u1;
      faces.L[2] = u0;
    }
  }

  function moveL(times = 1) {
    // Inverted vs prior sense so token L matches the user-facing direction
    // (same role as the old label↔token swap). L / L' / L2 stay mutual inverses.
    faces.L = rotateFaceCW(faces.L, times);
    for (let n = 0; n < times; n += 1) {
      const u0 = faces.U[0];
      const u2 = faces.U[2];
      const f0 = faces.F[0];
      const f2 = faces.F[2];
      const d0 = faces.D[0];
      const d2 = faces.D[2];
      const b1 = faces.B[1];
      const b3 = faces.B[3];
      // Left-layer sides only: DFL/DBL (D0/D2), not DFR/DBR.
      faces.U[0] = b3;
      faces.U[2] = b1;
      faces.B[1] = d2;
      faces.B[3] = d0;
      faces.D[0] = f0;
      faces.D[2] = f2;
      faces.F[0] = u0;
      faces.F[2] = u2;
    }
  }

  function moveR(times = 1) {
    // Inverted vs prior WCA-CW sense per user: token R' must spin the other way;
    // R / R' / R2 stay mutual inverses with matching CSS degrees.
    faces.R = rotateFaceCW(faces.R, times);
    for (let n = 0; n < times; n += 1) {
      const u1 = faces.U[1];
      const u3 = faces.U[3];
      const f1 = faces.F[1];
      const f3 = faces.F[3];
      const d1 = faces.D[1];
      const d3 = faces.D[3];
      const b0 = faces.B[0];
      const b2 = faces.B[2];
      faces.U[1] = f1;
      faces.U[3] = f3;
      faces.F[1] = d1;
      faces.F[3] = d3;
      faces.D[1] = b2;
      faces.D[3] = b0;
      faces.B[0] = u3;
      faces.B[2] = u1;
    }
  }

  const movers = { U: moveU, D: moveD, F: moveF, B: moveB, L: moveL, R: moveR };

  function parseToken(token) {
    const face = token[0];
    const suffix = token.slice(1);
    let quarterTurns = 1;
    if (suffix === "2") quarterTurns = 2;
    if (suffix === "'") quarterTurns = 3;
    return { face, quarterTurns, suffix };
  }

  function applyMove(token) {
    const { face, quarterTurns } = parseToken(token);
    movers[face](quarterTurns);
  }

  function flipWhiteDown() {
    const tmp = faces.U;
    faces.U = faces.D;
    faces.D = tmp;
    faces.F = rotateFace(faces.F, 2);
    faces.B = rotateFace(faces.B, 2);
    const left = faces.L;
    faces.L = rotateFace(faces.R, 2);
    faces.R = rotateFace(left, 2);
  }

  function faceletColor(face, x, y, z) {
    if (face === "U" && y === 1) {
      return faces.U[(z === 1 ? 2 : 0) + (x === 1 ? 1 : 0)];
    }
    if (face === "D" && y === -1) {
      return faces.D[(z === -1 ? 2 : 0) + (x === 1 ? 1 : 0)];
    }
    if (face === "F" && z === 1) {
      return faces.F[(y === -1 ? 2 : 0) + (x === 1 ? 1 : 0)];
    }
    if (face === "B" && z === -1) {
      return faces.B[(y === -1 ? 2 : 0) + (x === -1 ? 1 : 0)];
    }
    if (face === "L" && x === -1) {
      return faces.L[(y === -1 ? 2 : 0) + (z === 1 ? 1 : 0)];
    }
    if (face === "R" && x === 1) {
      return faces.R[(y === -1 ? 2 : 0) + (z === -1 ? 1 : 0)];
    }
    return null;
  }

  function cubieTranslate(x, y, z) {
    return `translate3d(${x * HALF}px, ${-y * HALF}px, ${z * HALF}px)`;
  }

  function paintCubie(node, x, y, z) {
    const focus = currentFocusTargets();
    FACE_ORDER.forEach((face) => {
      const sticker = node.querySelector(`[data-face="${face}"]`);
      if (!sticker) return;
      const color = faceletColor(face, x, y, z);
      if (!color) {
        sticker.hidden = true;
        sticker.className = `sticker face-${face.toLowerCase()}`;
        return;
      }
      sticker.hidden = false;
      const focusHit = focus.targets.find(
        (t) => t.face === face && t.x === x && t.y === y && t.z === z
      );
      const focusCls = focusHit ? ` ${focus.focusClass}` : "";
      sticker.className = `sticker face-${face.toLowerCase()} ${COLORS[color]}${focusCls}`;
    });
  }

  function clearStickerFocus() {
    cubieNodes.forEach((node) => {
      node.querySelectorAll(".sticker").forEach((s) => {
        s.classList.remove("is-focus", "is-focus-avoid");
      });
    });
  }

  /** Case config for the current step (yellow-work or white-corner), if any. */
  function activeCaseConfig() {
    const step = steps[stepIndex];
    if (!step?.cases) return null;
    if (step.preset === "yellow-work") {
      return YELLOW_CASES[caseId] || YELLOW_CASES["1"];
    }
    if (step.preset === "white-corner") {
      return WHITE_CORNER_CASES[caseId] || WHITE_CORNER_CASES.stuck;
    }
    return null;
  }

  /** Active highlight targets for this step / case (empty if none). */
  function currentFocusTargets() {
    if (!focusEnabled) return { targets: [], focusClass: "is-focus" };
    const step = steps[stepIndex];
    if (!step) return { targets: [], focusClass: "is-focus" };
    const cfg = activeCaseConfig();
    if (cfg?.focus?.length) {
      return { targets: cfg.focus, focusClass: cfg.focusClass || "is-focus" };
    }
    if (step.focus && step.focus.length) {
      return {
        targets: step.focus,
        focusClass: step.focusClass || "is-focus",
      };
    }
    return { targets: [], focusClass: "is-focus" };
  }

  function enableStepFocus() {
    focusEnabled = true;
  }

  function dismissStepFocus() {
    if (!focusEnabled) return;
    focusEnabled = false;
    clearStickerFocus();
  }

  function defaultViewForStep() {
    const cfg = activeCaseConfig();
    if (cfg?.view) return { x: cfg.view.x, y: cfg.view.y };
    const step = steps[stepIndex];
    if (step?.view) return { x: step.view.x, y: step.view.y };
    return { x: VIEW_DEFAULT.x, y: VIEW_DEFAULT.y };
  }

  function applyCubeView(animate) {
    const rig = els.cubeRig || els.cube;
    if (animate && !reducedMotion) {
      rig.style.transition =
        "transform 0.45s cubic-bezier(0.22, 1, 0.36, 1)";
    } else {
      rig.style.transition = "none";
    }
    rig.style.transform = `rotateX(${viewX}deg) rotateY(${viewY}deg)`;
  }

  /** Snap viewpoint back to the current step/case default. */
  function resetCubeView(animate = true) {
    const d = defaultViewForStep();
    viewX = d.x;
    viewY = d.y;
    applyCubeView(animate);
  }

  /** Re-apply sticker outlines after paints / moves. */
  function applyYellowCaseHighlights() {
    const { targets, focusClass } = currentFocusTargets();
    clearStickerFocus();
    if (!targets.length) return;
    targets.forEach(({ face, x, y, z }) => {
      const i = CUBIES.findIndex((c) => c.x === x && c.y === y && c.z === z);
      if (i < 0) return;
      const sticker = cubieNodes[i]?.querySelector(`[data-face="${face}"]`);
      if (sticker && !sticker.hidden) sticker.classList.add(focusClass);
    });
  }

  function applyCaseCopy() {
    const step = steps[stepIndex];
    if (!step) return;
    if (!step.cases) {
      els.hold.textContent = step.hold;
      els.stepBody.innerHTML = step.body;
      return;
    }
    const cfg = activeCaseConfig();
    if (!cfg) {
      els.hold.textContent = step.hold;
      els.stepBody.innerHTML = step.body;
      return;
    }
    els.hold.textContent = cfg.hold;
    els.stepBody.innerHTML = `${step.body}<span class="case-tip"> ${cfg.tip}</span>`;
  }

  function resetCubieTransforms() {
    cubieNodes.forEach((node, i) => {
      const { x, y, z } = CUBIES[i];
      node.style.transition = "none";
      node.style.transform = cubieTranslate(x, y, z);
    });
    void els.cube.offsetWidth;
  }

  function renderCube() {
    cubieNodes.forEach((node, i) => {
      const { x, y, z } = CUBIES[i];
      paintCubie(node, x, y, z);
      node.style.transform = cubieTranslate(x, y, z);
    });
    applyYellowCaseHighlights();
  }

  function layerPredicate(face) {
    if (face === "R") return (c) => c.x === 1;
    if (face === "L") return (c) => c.x === -1;
    if (face === "U") return (c) => c.y === 1;
    if (face === "D") return (c) => c.y === -1;
    if (face === "F") return (c) => c.z === 1;
    if (face === "B") return (c) => c.z === -1;
    return () => false;
  }

  /**
   * CSS degrees for one CW token (matched to applyMove / facelets).
   * Cubies use translate3d(x, -y, z): every CSS rotate*(θ) ≡ model rotate*(-θ).
   * R and L use inverted sense vs classic WCA-CW so tokens match the
   * user-facing direction fix; each family stays mutual inverses with continuity.
   */
  function turnDegrees(face, quarterTurns) {
    const cw = {
      U: -90,
      D: 90,
      R: 90,
      L: -90,
      F: 90,
      B: -90,
    }[face];
    if (quarterTurns === 2) return cw * 2;
    if (quarterTurns === 3) return -cw;
    return cw;
  }

  function axisRotate(face, deg) {
    if (face === "U" || face === "D") return `rotateY(${deg}deg)`;
    if (face === "R" || face === "L") return `rotateX(${deg}deg)`;
    return `rotateZ(${deg}deg)`;
  }

  function wait(ms) {
    return new Promise((resolve) => {
      setTimeout(resolve, ms);
    });
  }

  function nextFrame() {
    return new Promise((resolve) => {
      requestAnimationFrame(() => requestAnimationFrame(resolve));
    });
  }

  /** One 90° layer spin (CW or prime), then commit matching facelets. */
  async function animateQuarter(face, prime) {
    const token = prime ? `${face}'` : face;
    const deg = turnDegrees(face, prime ? 3 : 1);
    const ms = TURN_MS;
    const pred = layerPredicate(face);
    const moversIdx = [];

    renderCube();
    cubieNodes.forEach((node, i) => {
      const c = CUBIES[i];
      node.classList.remove("is-turning");
      node.style.transition = "none";
      node.style.transform = cubieTranslate(c.x, c.y, c.z);
      if (pred(c)) moversIdx.push(i);
    });
    await nextFrame();

    els.cubeOrbit.classList.add("turning");
    moversIdx.forEach((i) => {
      const c = CUBIES[i];
      const node = cubieNodes[i];
      node.classList.add("is-turning");
      node.style.transition = `transform ${ms}ms cubic-bezier(0.22, 0.61, 0.36, 1)`;
      node.style.transform = `${axisRotate(face, deg)} ${cubieTranslate(c.x, c.y, c.z)}`;
    });

    await wait(ms + 30);
    applyMove(token);
    els.cubeOrbit.classList.remove("turning");
    cubieNodes.forEach((node) => node.classList.remove("is-turning"));
    resetCubieTransforms();
    renderCube();
  }

  async function animateToken(token) {
    // Any real turn dismisses teaching highlights for this step visit.
    dismissStepFocus();

    const { face, quarterTurns } = parseToken(token);

    if (reducedMotion) {
      applyMove(token);
      renderCube();
      return;
    }

    // Doubles: two successive CW quarters (X then X), not one ±180 tween.
    if (quarterTurns === 2) {
      await animateQuarter(face, false);
      await wait(60);
      await animateQuarter(face, false);
      return;
    }

    await animateQuarter(face, quarterTurns === 3);
  }

  function stopPlay() {
    playing = false;
    syncPlayButtonLabels(false);
  }

  let activePlayAlgId = "alg1";

  function isBothAlgStep() {
    return steps[stepIndex]?.showAlg === "both";
  }

  function allAlgControlButtons() {
    const list = [els.btnPlay, els.btnStep, els.btnReset];
    [els.algActions1, els.algActions2].forEach((block) => {
      if (block) list.push(...block.querySelectorAll("button"));
    });
    return list.filter(Boolean);
  }

  function playButtons() {
    const btns = [];
    if (els.btnPlay) btns.push(els.btnPlay);
    [els.algActions1, els.algActions2].forEach((block) => {
      if (!block) return;
      block.querySelectorAll("[data-play-alg]").forEach((b) => btns.push(b));
    });
    return btns;
  }

  function syncPlayButtonLabels(playingNow) {
    playButtons().forEach((btn) => {
      btn.textContent = playingNow ? "暫停" : "播放";
    });
  }

  function setAlgActionsLayout(showDual) {
    if (els.algActionsShared) els.algActionsShared.hidden = showDual;
    if (els.algActions1) els.algActions1.hidden = !showDual;
    if (els.algActions2) els.algActions2.hidden = !showDual;
  }

  function withPlayAlg(which, fn) {
    if (animating) return;
    if (isBothAlgStep()) selectPlayAlg(which);
    fn();
  }

  function resetAlgPlayback() {
    if (animating) return;
    stopPlay();
    playCursor = -1;
    algFinished = false;
    enableStepFocus();
    setPreset(steps[stepIndex].preset);
    paintMoveHighlight();
    setControlsBusy(false);
  }

  /**
   * Initial cube pose for a step. Base is always solved with white on top.
   * Some steps then apply a fixed move sequence for the demo / playback start.
   */
  function setPreset(name) {
    faces = solvedFaces();
    if (name === "yellow-work") {
      // White down, yellow on U — then case-specific legal setups.
      flipWhiteDown();
      if (caseId === "1") {
        // 1 黃: yellow face up → R U R' U R U2 R' → U' (yellow at UBL)
        YELLOW_CASE1_SETUP.forEach((token) => applyMove(token));
        applyMove("U'");
      } else if (caseId === "2") {
        // 2 黃 with UBL yellow facing back; 公式 2 → 1 黃.
        YELLOW_CASE2_SETUP.forEach((token) => applyMove(token));
      } else if (caseId === "0") {
        // 0 黃 (back row clear); 公式 2 → 1 黃, twice → solved yellow.
        ALG2_INV.forEach((token) => applyMove(token));
        ALG2_INV.forEach((token) => applyMove(token));
      }
    } else if (name === "white-corner") {
      const cfg = WHITE_CORNER_CASES[caseId] || WHITE_CORNER_CASES.stuck;
      (cfg.setup || []).forEach((token) => applyMove(token));
    } else if (name === "after-alg1") {
      // 第二步: four whites on U + same-colour pair on L, but messy D / lower sides
      // (reachable scramble — not a solved yellow bottom).
      ["R", "U'", "L2", "B2", "D'", "L"].forEach((token) => applyMove(token));
    } else if (name === "alg1-u") {
      // 第四步: solved → 白面朝下（黃在上）→ 公式 1 → U
      // Invariant: four yellows on U, four whites on D.
      flipWhiteDown();
      ALG1.forEach((token) => applyMove(token));
      applyMove("U");
    }
    resetCubieTransforms();
    renderCube();
  }

  function renderMoves(tokens, container) {
    const root = container || els.moves;
    if (!root) return;
    root.innerHTML = "";
    tokens.forEach((token, i) => {
      const span = document.createElement("span");
      span.className = "move";
      span.textContent = token;
      span.dataset.index = String(i);
      root.appendChild(span);
    });
  }

  /** Moves row that receives play / step highlights. */
  let playMovesRoot = null;

  function paintMoveHighlight() {
    [els.moves, els.moves2].forEach((root) => {
      if (!root) return;
      const active = root === playMovesRoot;
      [...root.children].forEach((node, i) => {
        node.classList.toggle("current", active && i === playCursor);
        node.classList.toggle("done", active && playCursor > i);
      });
    });
  }

  function selectPlayAlg(which) {
    activePlayAlgId = which;
    const useAlg2 = which === "alg2";
    activeAlg = useAlg2 ? [...ALG2] : [...ALG1];
    playMovesRoot = useAlg2 ? els.moves2 : els.moves;
    els.algSeqPrimary?.classList.toggle("is-active", !useAlg2);
    els.algSeqSecondary?.classList.toggle("is-active", useAlg2);
    stopPlay();
    playCursor = -1;
    algFinished = false;
    paintMoveHighlight();
  }

  function renderPracticeMoves() {
    const step = steps[stepIndex];
    const show = step.id === "intro" || step.id === "notation";
    if (!els.practiceMoves) return;
    els.practiceMoves.hidden = !show;
    setPracticeBusy(animating || playing);
  }

  function setPracticeBusy(busy) {
    if (!els.practiceBtns) return;
    [...els.practiceBtns.querySelectorAll("button")].forEach((btn) => {
      btn.disabled = busy;
    });
  }

  async function practiceMove(token) {
    if (animating || playing) return;
    const step = steps[stepIndex];
    if (!step || (step.id !== "intro" && step.id !== "notation")) return;
    animating = true;
    setControlsBusy(true);
    setPracticeBusy(true);
    try {
      await animateToken(token);
    } finally {
      animating = false;
      setControlsBusy(false);
      setPracticeBusy(false);
    }
  }

  function loadAlgForStep() {
    const step = steps[stepIndex];
    stopPlay();
    playCursor = -1;
    algFinished = false;
    renderPracticeMoves();

    if (!step.showAlg) {
      els.algBlock.hidden = true;
      setAlgActionsLayout(false);
      if (els.algSeqSecondary) els.algSeqSecondary.hidden = true;
      els.algSeqPrimary?.classList.remove("is-playable");
      els.algSeqSecondary?.classList.remove("is-playable", "is-active");
      els.algSeqPrimary?.classList.add("is-active");
      activeAlg = [];
      playMovesRoot = null;
      els.btnPlay.disabled = true;
      els.btnStep.disabled = true;
      return;
    }

    els.algBlock.hidden = false;
    setAlgActionsLayout(step.showAlg === "both");
    if (step.showAlg === "alg1") {
      if (els.algSeqSecondary) els.algSeqSecondary.hidden = true;
      els.algSeqPrimary?.classList.remove("is-playable");
      els.algSeqSecondary?.classList.remove("is-playable", "is-active");
      els.algSeqPrimary?.classList.add("is-active");
      activeAlg = [...ALG1];
      playMovesRoot = els.moves;
      els.algLabel.textContent = "公式 1 · F R' F L2 F' R F L2 F2";
      renderMoves(ALG1, els.moves);
    } else if (step.showAlg === "alg2") {
      if (els.algSeqSecondary) els.algSeqSecondary.hidden = true;
      els.algSeqPrimary?.classList.remove("is-playable");
      els.algSeqSecondary?.classList.remove("is-playable", "is-active");
      els.algSeqPrimary?.classList.add("is-active");
      activeAlg = [...ALG2];
      playMovesRoot = els.moves;
      els.algLabel.textContent = "公式 2 · R' U' R U' R' U2 R";
      renderMoves(ALG2, els.moves);
    } else if (step.showAlg === "case") {
      if (els.algSeqSecondary) els.algSeqSecondary.hidden = true;
      els.algSeqPrimary?.classList.remove("is-playable");
      els.algSeqSecondary?.classList.remove("is-playable", "is-active");
      els.algSeqPrimary?.classList.add("is-active");
      const cfg = activeCaseConfig();
      const tokens = cfg?.alg ? [...cfg.alg] : [];
      activeAlg = tokens;
      playMovesRoot = els.moves;
      els.algLabel.textContent = cfg?.algLabel || "手法";
      renderMoves(tokens, els.moves);
    } else {
      // Notation page: show 公式 1 and 公式 2 together (no hide/switch).
      if (els.algSeqSecondary) els.algSeqSecondary.hidden = false;
      els.algSeqPrimary?.classList.add("is-playable", "is-active");
      els.algSeqSecondary?.classList.add("is-playable");
      els.algSeqSecondary?.classList.remove("is-active");
      els.algLabel.textContent = "公式 1 · F R' F L2 F' R F L2 F2";
      if (els.algLabel2) {
        els.algLabel2.textContent = "公式 2 · R' U' R U' R' U2 R";
      }
      renderMoves(ALG1, els.moves);
      renderMoves(ALG2, els.moves2);
      activePlayAlgId = "alg1";
      activeAlg = [...ALG1];
      playMovesRoot = els.moves;
    }
    paintMoveHighlight();
    els.btnPlay.disabled = false;
    els.btnStep.disabled = false;
  }

  function renderCases() {
    const step = steps[stepIndex];
    els.cases.innerHTML = "";
    if (!step.cases) {
      if (els.casesBlock) els.casesBlock.hidden = true;
      return;
    }
    if (els.casesBlock) els.casesBlock.hidden = false;
    const labels = {
      "1": "1 黃",
      "2": "2 黃",
      "0": "0 黃",
      stuck: "上層卡住",
      side: "白在右側",
      front: "白在前面",
      down: "白在下面",
    };
    if (!step.cases.includes(caseId)) {
      caseId = step.cases[0];
    }
    step.cases.forEach((id) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = labels[id] || id;
      btn.classList.toggle("active", caseId === id);
      btn.addEventListener("click", () => {
        caseId = id;
        enableStepFocus();
        renderCases();
        applyCaseCopy();
        setPreset(step.preset);
        loadAlgForStep();
        resetCubeView(true);
      });
      els.cases.appendChild(btn);
    });
  }

  function animateStepPanel() {
    els.stepPanel.classList.remove("enter");
    void els.stepPanel.offsetWidth;
    els.stepPanel.classList.add("enter");
  }

  function renderProgress() {
    const pct = ((stepIndex + 1) / steps.length) * 100;
    els.railFill.style.width = `${pct}%`;
    els.stepCount.textContent = `${stepIndex + 1} / ${steps.length}`;
    if (els.appVersion) {
      els.appVersion.textContent = `v${APP_VERSION}`;
      els.appVersion.hidden = stepIndex !== 0;
    }
  }

  function setControlsBusy(busy) {
    const noAlg = !activeAlg.length;
    allAlgControlButtons().forEach((btn) => {
      const isReset =
        btn === els.btnReset || btn.dataset?.resetAlg !== undefined;
      btn.disabled = isReset ? busy : busy || noAlg;
    });
    els.btnPrev.disabled = busy || stepIndex === 0;
    els.btnNext.disabled = busy || stepIndex === steps.length - 1;
    setPracticeBusy(busy);
  }

  function canStepAlg() {
    if (isBothAlgStep()) {
      return [...(els.algActions1?.querySelectorAll("[data-step-alg]") || [])].some(
        (b) => !b.disabled
      );
    }
    return els.btnStep && !els.btnStep.disabled;
  }

  function renderStep() {
    const step = steps[stepIndex];
    if (step.cases?.length && !step.cases.includes(caseId)) {
      caseId = step.cases[0];
    }
    enableStepFocus();
    els.stepTitle.textContent = step.title;
    els.cubeOrbit.dataset.hint = step.hint || "";
    els.btnNext.textContent =
      stepIndex === steps.length - 1 ? "完成" : "下一階段";
    renderProgress();
    renderCases();
    applyCaseCopy();
    setPreset(step.preset);
    loadAlgForStep();
    resetCubeView(false);
    setControlsBusy(false);
    animateStepPanel();
  }

  function goTo(index) {
    if (animating) return;
    stopPlay();
    stepIndex = Math.max(0, Math.min(steps.length - 1, index));
    renderStep();
  }

  async function stepOnce() {
    if (animating || !activeAlg.length) return;

    // After the alg finished, the next 轉一下 only restores the step initial pose.
    if (algFinished) {
      algFinished = false;
      playCursor = -1;
      enableStepFocus();
      setPreset(steps[stepIndex].preset);
      paintMoveHighlight();
      return;
    }

    if (playCursor === -1) {
      setPreset(steps[stepIndex].preset);
    }
    if (playCursor >= activeAlg.length - 1) return;

    playCursor += 1;
    paintMoveHighlight();
    animating = true;
    setControlsBusy(true);
    els.btnPlay.disabled = false;
    try {
      await animateToken(activeAlg[playCursor]);
    } finally {
      animating = false;
      if (playCursor >= activeAlg.length - 1) {
        algFinished = true;
      }
      if (!playing) setControlsBusy(false);
    }
  }

  async function playAlg() {
    if (!activeAlg.length || animating) return;
    if (playing) {
      stopPlay();
      setControlsBusy(false);
      return;
    }

    // Replay from the step initial pose when idle at start or after a finished run.
    if (algFinished || playCursor === -1 || playCursor >= activeAlg.length - 1) {
      algFinished = false;
      playCursor = -1;
      enableStepFocus();
      setPreset(steps[stepIndex].preset);
      paintMoveHighlight();
    }

    playing = true;
    syncPlayButtonLabels(true);
    setControlsBusy(true);
    if (els.btnPlay) els.btnPlay.disabled = false;

    while (playing && playCursor < activeAlg.length - 1) {
      await stepOnce();
      if (!playing) break;
      await wait(90);
    }
    // Leave the cube on the finished pose; algFinished is set inside stepOnce.
    stopPlay();
    setControlsBusy(false);
  }

  function buildCubeDom() {
    els.cube.innerHTML = "";
    cubieNodes = CUBIES.map(({ x, y, z }, index) => {
      const cubie = document.createElement("div");
      cubie.className = "cubie";
      cubie.dataset.index = String(index);
      cubie.style.transform = cubieTranslate(x, y, z);
      FACE_ORDER.forEach((face) => {
        const sticker = document.createElement("div");
        sticker.className = `sticker face-${face.toLowerCase()}`;
        sticker.dataset.face = face;
        cubie.appendChild(sticker);
      });
      els.cube.appendChild(cubie);
      return cubie;
    });
  }

  els.btnPrev.addEventListener("click", () => goTo(stepIndex - 1));
  els.btnNext.addEventListener("click", () => goTo(stepIndex + 1));
  els.btnPlay.addEventListener("click", () => {
    playAlg();
  });
  els.btnStep.addEventListener("click", () => {
    stopPlay();
    stepOnce();
  });
  window.addEventListener("keydown", (event) => {
    if (event.code !== "Space" && event.key !== " ") return;
    if (event.repeat) return;
    const tag = (event.target && event.target.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
    if (!canStepAlg()) return;
    event.preventDefault();
    stopPlay();
    if (isBothAlgStep()) selectPlayAlg(activePlayAlgId);
    stepOnce();
  });
  els.btnReset.addEventListener("click", () => resetAlgPlayback());
  [els.algActions1, els.algActions2].forEach((block) => {
    if (!block) return;
    block.querySelector("[data-play-alg]")?.addEventListener("click", () => {
      withPlayAlg(block.querySelector("[data-play-alg]").dataset.playAlg, () =>
        playAlg()
      );
    });
    block.querySelector("[data-step-alg]")?.addEventListener("click", () => {
      withPlayAlg(block.querySelector("[data-step-alg]").dataset.stepAlg, () => {
        stopPlay();
        stepOnce();
      });
    });
    block.querySelector("[data-reset-alg]")?.addEventListener("click", () => {
      withPlayAlg(block.querySelector("[data-reset-alg]").dataset.resetAlg, () =>
        resetAlgPlayback()
      );
    });
  });
  if (els.practiceBtns) {
    els.practiceBtns.addEventListener("click", (event) => {
      const btn = event.target.closest("button[data-move]");
      if (!btn || btn.disabled) return;
      practiceMove(btn.dataset.move);
    });
  }

  els.algLabel.addEventListener("click", () => {
    const step = steps[stepIndex];
    if (step.showAlg !== "both" || animating) return;
    selectPlayAlg("alg1");
  });
  if (els.algLabel2) {
    els.algLabel2.addEventListener("click", () => {
      const step = steps[stepIndex];
      if (step.showAlg !== "both" || animating) return;
      selectPlayAlg("alg2");
    });
  }

  // Orbit the viewpoint by dragging on the cube area. Double-click resets.
  els.cubeOrbit.addEventListener("pointerdown", (event) => {
    if (event.button !== 0) return;
    viewDragging = true;
    viewPointerId = event.pointerId;
    viewLastX = event.clientX;
    viewLastY = event.clientY;
    els.cubeOrbit.classList.add("is-dragging");
    els.cubeOrbit.setPointerCapture(event.pointerId);
    applyCubeView(false);
  });

  els.cubeOrbit.addEventListener("pointermove", (event) => {
    if (!viewDragging || event.pointerId !== viewPointerId) return;
    const dx = event.clientX - viewLastX;
    const dy = event.clientY - viewLastY;
    viewLastX = event.clientX;
    viewLastY = event.clientY;
    // Horizontal drag → yaw; vertical drag → pitch (clamped so U stays mostly up).
    viewY += dx * 0.45;
    viewX = Math.max(-88, Math.min(88, viewX - dy * 0.45));
    applyCubeView(false);
  });

  function endViewDrag(event) {
    if (!viewDragging || event.pointerId !== viewPointerId) return;
    viewDragging = false;
    viewPointerId = null;
    els.cubeOrbit.classList.remove("is-dragging");
    try {
      els.cubeOrbit.releasePointerCapture(event.pointerId);
    } catch (_) {
      /* already released */
    }
  }

  els.cubeOrbit.addEventListener("pointerup", endViewDrag);
  els.cubeOrbit.addEventListener("pointercancel", endViewDrag);

  els.cubeOrbit.addEventListener("dblclick", (event) => {
    event.preventDefault();
    resetCubeView(true);
  });

  buildCubeDom();
  faces = solvedFaces();
  renderStep();
})();

    </script>
  </body>
</html>
