<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>22rubik_teacher</title>
    <style>
      :root {
        --bg: #0f172a;
        --fg: #f8fafc;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background:
          radial-gradient(circle at top, #1e293b 0%, transparent 55%),
          var(--bg);
        color: var(--fg);
      }

      main {
        text-align: center;
        padding: 2rem;
      }

      h1 {
        margin: 0 0 0.5rem;
        font-size: clamp(2rem, 6vw, 3.5rem);
        letter-spacing: 0.02em;
      }

      p {
        margin: 0;
        color: var(--muted);
        font-size: 1.1rem;
      }

      .brand {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello world</h1>
      <p>
        <span class="brand">22rubik_teacher</span> GitHub Pages homepage
        placeholder
      </p>
    </main>
  </body>
</html>
