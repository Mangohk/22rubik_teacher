<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>22rubik_teacher · 2×2 解法步驟</title>
    <meta
      name="description"
      content="2x2 Rubik beginner steps based on David Guo's method, with Grubiks/Ruwix-style step navigation."
    />
    <link rel="stylesheet" href="assets/solve.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <a class="brand" href="./">22rubik<span>_teacher</span></a>
        <p class="credit">
          解法流程參考
          <a
            href="https://www.davidguo.idv.tw/Cube/22beginner.htm"
            target="_blank"
            rel="noopener noreferrer"
            >David Guo 二階簡易解法</a
          >
          · UI 參考 Grubiks / Ruwix
        </p>
      </header>

      <div class="stage">
        <section class="panel lesson" aria-labelledby="step-title">
          <div class="kicker">逐步教學 · Back / Next</div>
          <h1>2×2 魔術方塊初學者解法</h1>
          <p class="lead">
            一次只看一步。用下方進度列或「上一步／下一步」前進，公式可逐步或自動播放。
          </p>

          <div class="progress" id="progress" aria-label="解法步驟進度"></div>

          <h2 class="step-title" id="step-title">載入中…</h2>
          <p class="step-body" id="step-body"></p>

          <div class="cases" id="cases" hidden></div>

          <div class="alg-block" id="alg-block" hidden>
            <div class="alg-label" id="alg-label"></div>
            <div class="moves" id="moves" aria-live="polite"></div>
            <div class="controls">
              <button class="btn btn-primary" type="button" id="btn-play">
                播放公式
              </button>
              <button class="btn btn-secondary" type="button" id="btn-step">
                下一步移動
              </button>
              <button class="btn btn-ghost" type="button" id="btn-reset">
                重設方塊
              </button>
            </div>
          </div>

          <div class="nav-row">
            <button class="btn btn-ghost" type="button" id="btn-prev">
              ← 上一步
            </button>
            <button class="btn btn-primary" type="button" id="btn-next">
              下一步 →
            </button>
          </div>

          <p class="footnote">
            圖示與動畫為本站重繪，並未複製原站圖片。公式依原站編號解讀為標準 WCA
            符號。知名解法站呈現方式參考：
            <a
              href="https://www.grubiks.com/solvers/rubiks-cube-3x3x3/"
              target="_blank"
              rel="noopener noreferrer"
              >Grubiks</a
            >
            （Back/Next）、
            <a
              href="https://ruwix.com/twisty-puzzles/2x2x2-rubiks-cube-pocket/"
              target="_blank"
              rel="noopener noreferrer"
              >Ruwix 2×2</a
            >
            （公式逐步顯示）。
          </p>
        </section>

        <aside class="panel viz" aria-label="方塊示意">
          <p class="hint">
            <span class="hold" id="hold">拿著方塊…</span>
          </p>
          <div class="cube-stage">
            <div class="cube" id="cube" aria-hidden="true"></div>
          </div>
          <p class="hint">拖曳無需——用「播放公式」看每一手下在方塊上的變化。</p>
        </aside>
      </div>
    </div>
    <script src="assets/solve.js"></script>
  </body>
</html>
