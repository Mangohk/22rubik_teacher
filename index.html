<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>22rubik_teacher</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+TC:wght@400;600&family=Syne:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #071512;
        --paper: #f3fff8;
        --fog: #b7d4c8;
        --accent: #ffb020;
        --mint: #3ddea8;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "IBM Plex Sans TC", sans-serif;
        color: var(--paper);
        background:
          radial-gradient(900px 480px at 15% -10%, rgba(61, 222, 168, 0.24), transparent 55%),
          radial-gradient(700px 420px at 100% 10%, rgba(255, 176, 32, 0.2), transparent 50%),
          linear-gradient(160deg, #071512 0%, #0f2a24 50%, #132018 100%);
        display: grid;
        place-items: center;
        padding: 1.5rem;
      }

      main {
        width: min(640px, 100%);
        text-align: left;
        animation: rise 0.8s ease both;
      }

      .brand {
        font-family: "Syne", sans-serif;
        font-weight: 800;
        font-size: clamp(2.4rem, 8vw, 4rem);
        line-height: 1;
        margin: 0 0 1rem;
        letter-spacing: 0.02em;
      }

      .brand span {
        color: var(--accent);
      }

      p {
        margin: 0 0 1.5rem;
        color: var(--fog);
        font-size: 1.1rem;
        line-height: 1.55;
        max-width: 34ch;
      }

      .cta {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.85rem 1.2rem;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent), #ff8d2a);
        color: var(--ink);
        font-weight: 700;
        text-decoration: none;
        box-shadow: 0 16px 40px rgba(255, 176, 32, 0.25);
        transition: transform 0.2s ease;
      }

      .cta:hover {
        transform: translateY(-2px);
      }

      .cta::after {
        content: "→";
        transition: transform 0.2s ease;
      }

      .cta:hover::after {
        transform: translateX(3px);
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="brand">22rubik<span>_teacher</span></h1>
      <p>學解 2×2 魔術方塊。先從逐步教學開始。</p>
      <a class="cta" href="solve.html">開始 2×2 解法步驟</a>
    </main>
  </body>
</html>
